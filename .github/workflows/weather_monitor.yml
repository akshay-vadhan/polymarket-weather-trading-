# ╔══════════════════════════════════════════════════════════════╗
# ║  GitHub Actions - Polymarket Weather Trading Monitor        ║
# ║  Auto-runs every 2 hours | Telegram alerts                  ║
# ╚══════════════════════════════════════════════════════════════╝

name: 🌡️ Weather Trading Monitor

on:
  # ── Scheduled runs ────────────────────────────
  schedule:
    # Har 2 ghante mein run karo (UTC time)
    # IST = UTC+5:30 | EST = UTC-5
    - cron: "0 */2 * * *"

    # Alternative: Specific hours par run karo
    # Subah 6 AM IST (12:30 AM UTC) aur Shaam 6 PM IST (12:30 PM UTC)
    # - cron: "30 0,12 * * *"

  # ── Manual trigger ────────────────────────────
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run Mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - quick
          - signal
          - data-only
      export_csv:
        description: "CSV files export karo?"
        required: false
        default: false
        type: boolean
      station:
        description: "Specific station"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - VILK
          - KLGA

  # ── Push trigger (testing ke liye) ────────────
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "config/**.json"
      - ".github/workflows/**.yml"

# ─────────────────────────────────────────────────
#              ENVIRONMENT VARIABLES
# ─────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.11"
  # Run mode: manual input ya default 'quick' for scheduled runs
  RUN_MODE: ${{ github.event.inputs.run_mode || 'quick' }}

# ─────────────────────────────────────────────────
#              JOBS
# ─────────────────────────────────────────────────
jobs:
  weather-monitor:
    name: 🌡️ Weather Trading Analysis
    runs-on: ubuntu-latest

    # Timeout: 10 minutes (API calls + processing)
    timeout-minutes: 10

    steps:
      # ── Step 1: Checkout Code ──────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ── Step 2: Python Setup ───────────────────
      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # ── Step 3: Install Dependencies ──────────
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Dependencies installed"
          pip list

      # ── Step 4: Validate Environment ──────────
      - name: 🔍 Validate Secrets
        run: |
          echo "Checking required secrets..."
          if [ -z "${{ secrets.VISUAL_CROSSING_API_KEY }}" ]; then
            echo "❌ ERROR: VISUAL_CROSSING_API_KEY secret missing!"
            exit 1
          fi
          echo "✅ VISUAL_CROSSING_API_KEY: Set"

          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "⚠️  WARNING: TELEGRAM_BOT_TOKEN not set"
          else
            echo "✅ TELEGRAM_BOT_TOKEN: Set"
          fi

          if [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "⚠️  WARNING: TELEGRAM_CHAT_ID not set"
          else
            echo "✅ TELEGRAM_CHAT_ID: Set"
          fi

      # ── Step 5: Create Directories ────────────
      - name: 📁 Create Required Directories
        run: |
          mkdir -p data/exports
          mkdir -p logs
          echo "✅ Directories created"

      # ── Step 6: Run Weather Monitor ───────────
      - name: 🌡️ Run Weather Trading Monitor
        env:
          # Required
          VISUAL_CROSSING_API_KEY: ${{ secrets.VISUAL_CROSSING_API_KEY }}

          # Telegram (optional but recommended)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID  : ${{ secrets.TELEGRAM_CHAT_ID }}

          # Threshold overrides (optional)
          VILK_THRESHOLD_LOW : ${{ secrets.VILK_THRESHOLD_LOW }}
          VILK_THRESHOLD_HIGH: ${{ secrets.VILK_THRESHOLD_HIGH }}
          KLGA_THRESHOLD_LOW : ${{ secrets.KLGA_THRESHOLD_LOW }}
          KLGA_THRESHOLD_HIGH: ${{ secrets.KLGA_THRESHOLD_HIGH }}

          # GitHub Actions identifier
          GITHUB_ACTIONS: "true"

        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Run Mode  : ${{ env.RUN_MODE }}"
          echo "  Station   : ${{ github.event.inputs.station || 'both' }}"
          echo "  Timestamp : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Build command
          CMD="python main.py --mode ${{ env.RUN_MODE }}"

          # Station filter
          if [ "${{ github.event.inputs.station }}" != "" ] && \
             [ "${{ github.event.inputs.station }}" != "both" ]; then
            CMD="$CMD --station ${{ github.event.inputs.station }}"
          fi

          # CSV export
          if [ "${{ github.event.inputs.export_csv }}" == "true" ]; then
            CMD="$CMD --export-csv"
          fi

          echo "Running: $CMD"
          $CMD

      # ── Step 7: Upload CSV Artifacts ──────────
      - name: 📊 Upload Data Artifacts
        if: |
          always() &&
          github.event.inputs.export_csv == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weather-trading-data-${{ github.run_number }}
          path: |
            data/exports/*.csv
          retention-days: 30
          if-no-files-found: ignore

      # ── Step 8: Upload Cache ───────────────────
      - name: 💾 Save Cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-cache
          path: data/historical_cache.json
          retention-days: 7
          if-no-files-found: ignore

      # ── Step 9: Job Summary ────────────────────
      - name: 📋 Job Summary
        if: always()
        run: |
          echo "## 🌡️ Weather Trading Monitor Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run Mode | ${{ env.RUN_MODE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Station | ${{ github.event.inputs.station || 'both' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Time (UTC) | $(date -u '+%Y-%m-%d %H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Stations Monitored" >> $GITHUB_STEP_SUMMARY
          echo "- 📍 **VILK** - Lucknow, Chaudhary Charan Singh Intl Airport (°C)" >> $GITHUB_STEP_SUMMARY
          echo "- 📍 **KLGA** - New York, LaGuardia Airport (°F)" >> $GITHUB_STEP_SUMMARY

      # ── Step 10: Failure Notification ─────────
      - name: 🔴 Notify on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID  : ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python -c "
          import os, requests
          token   = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          msg = (
              '🔴 <b>GitHub Actions FAILED</b>\n'
              'Workflow: Weather Trading Monitor\n'
              'Run: #${{ github.run_number }}\n'
              'Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          )
          requests.post(
              f'https://api.telegram.org/bot{token}/sendMessage',
              json={'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}
          )
          print('Failure notification sent')
            "
          fi
